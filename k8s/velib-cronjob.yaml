apiVersion: batch/v1
kind: CronJob
metadata:
  name: velib-collect
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: collect
            image: python:3.12-slim
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 200m, memory: 256Mi}
            command: ["sh", "-c", "pip install -q boto3 requests && python /app/collect.py"]
            envFrom:
            - secretRef:
                name: s3-creds
            volumeMounts:
            - name: script
              mountPath: /app
          volumes:
          - name: script
            configMap:
              name: velib-collect
